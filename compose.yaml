x-app: &app
  build:
    context: .
  volumes:
    - ./card_game:/app

x-postgres: &postgres
  image: postgres:16
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 2s
    timeout: 5s
    retries: 15
    start_period: 10s

services:
  tools:
    image: nginx:alpine
    volumes:
      - ./tools:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${TOOLS_PORT:-8080}:80"

  api:
    <<: *app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/card_game
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        python -m flask --app app init-db &&
        exec python -m flask --app app run --debug --host=0.0.0.0 --port=5000

  db:
    <<: *postgres
    environment:
      POSTGRES_DB: card_game
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  tests:
    <<: *app
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql://postgres:postgres@test-db:5432/card_game_test
    depends_on:
      test-db:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider"]

  test-db:
    <<: *postgres
    profiles: ["test"]
    environment:
      POSTGRES_DB: card_game_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data:
