name: PostgreSQL repository tests

on:
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "**/*.sql"
      - "card_game/requirements.txt"
      - ".github/workflows/validate-db.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - "**/*.sql"
      - "card_game/requirements.txt"
      - ".github/workflows/validate-db.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: card_game_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/card_game_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        working-directory: card_game
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PostgreSQL integration tests
        working-directory: card_game
        run: python -m pytest tests/adapters/test_postgres_game_repository.py -v
